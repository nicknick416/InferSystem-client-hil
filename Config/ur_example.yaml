# Sanitized example: configure hardware, calibration, endpoints and task limits before --live.






robot:
  type: ur
  name: ur_arm
  robot_ip: "192.0.2.10"
  dof: 6

  gripper:
    enabled: true
    name: robotiq
    port: 63352
    max_width: 0.085
    min_width: 0.0
    max_velocity: 0.2
    max_force: 100.0
    speed: 255
    force: 100

  control:
    frequency_hz: 125
    home_position_deg: [180, -90, 90, -90, -90, 0]
    home_speed: 0.5
    home_acceleration: 0.5
    joint_step_limit: 0.05
    servoj_lookahead: 0.1
    servoj_gain: 300
    wait_step_reached: false








cameras: {}

inference:
  server: "127.0.0.1:5555"
  fps: 30
  jpeg_quality: 90
  n_execute: 40




  action_space: joint_position
  policy_format: normal
  canonical_dim: 32
  arm_dim: 6
  gripper_index: 6
  gripper_mode: binary
  gripper_threshold: 0.5

  latency_compensation: true
  smooth:
    enabled: false
    overlap_steps: 8
